# ROS 1 Noetic move_base / TurtleBot3 Waffle in the Unity simulation. Loaded into the move_base
# node's namespace; /use_sim_time is set by the launch file.
# Global planner NavfnROS, local planner DWAPlannerROS. robot_radius 0.25 m covers the Unity
# TurtleBot3 Waffle's colliders (UnityProject/Assets/turtlebot3/model.urdf): the body box sits
# 0.064 m behind base_link, so its rear corners are 0.238 m from the turning centre. Re-measure
# before changing platforms; cmd_vel_guard, teleop_assist and the tests use the same value.
# 0.5 s expected_update_rate is a maximum scan interval in simulation time, not Hz.
# The collision-monitor stop lives in cmd_vel_guard (launch file), not here.
# With perception, move_base_predicted.yaml adds tracked obstacles' predicted paths to the local
# costmap.

base_global_planner: navfn/NavfnROS
base_local_planner: dwa_local_planner/DWAPlannerROS
controller_frequency: 10.0
planner_frequency: 1.0          # replan the global path at 1 Hz
# Act within 2 s when the planners fail: among roaming carts, 15 s of patience let the robot sit
# still for 17 s with a lost route (Unity log, October 2026). The recovery list below is long so
# a goal still aborts only after ~46 s of failing, as before: delivery_controller treats an
# abort as a failed delivery. test/test_move_base_config.py checks this budget.
planner_patience: 2.0
controller_patience: 2.0
oscillation_timeout: 10.0       # recover if the robot moves < 0.1 m in 10 s
oscillation_distance: 0.1
max_planning_retries: -1
recovery_behavior_enabled: true
clearing_rotation_allowed: true
shutdown_costmaps: false
# Recover by clearing the scan obstacles and replanning. The default list adds two full in-place
# spins (rotate_recovery), which see nothing new with a 360 degree lidar and only stall the robot.
# layer_names must match the costmap plugin names: the default ("obstacles") clears nothing here.
# A recovery that gets the robot moving again resets the list; 22 clears x 2 s of patience keep
# the old ~46 s before move_base aborts the goal.
recovery_behaviors:
  - {name: conservative_reset, type: clear_costmap_recovery/ClearCostmapRecovery}
  - {name: aggressive_reset_1, type: clear_costmap_recovery/ClearCostmapRecovery}
  - {name: aggressive_reset_2, type: clear_costmap_recovery/ClearCostmapRecovery}
  - {name: aggressive_reset_3, type: clear_costmap_recovery/ClearCostmapRecovery}
  - {name: aggressive_reset_4, type: clear_costmap_recovery/ClearCostmapRecovery}
  - {name: aggressive_reset_5, type: clear_costmap_recovery/ClearCostmapRecovery}
  - {name: aggressive_reset_6, type: clear_costmap_recovery/ClearCostmapRecovery}
  - {name: aggressive_reset_7, type: clear_costmap_recovery/ClearCostmapRecovery}
  - {name: aggressive_reset_8, type: clear_costmap_recovery/ClearCostmapRecovery}
  - {name: aggressive_reset_9, type: clear_costmap_recovery/ClearCostmapRecovery}
  - {name: aggressive_reset_10, type: clear_costmap_recovery/ClearCostmapRecovery}
  - {name: aggressive_reset_11, type: clear_costmap_recovery/ClearCostmapRecovery}
  - {name: aggressive_reset_12, type: clear_costmap_recovery/ClearCostmapRecovery}
  - {name: aggressive_reset_13, type: clear_costmap_recovery/ClearCostmapRecovery}
  - {name: aggressive_reset_14, type: clear_costmap_recovery/ClearCostmapRecovery}
  - {name: aggressive_reset_15, type: clear_costmap_recovery/ClearCostmapRecovery}
  - {name: aggressive_reset_16, type: clear_costmap_recovery/ClearCostmapRecovery}
  - {name: aggressive_reset_17, type: clear_costmap_recovery/ClearCostmapRecovery}
  - {name: aggressive_reset_18, type: clear_costmap_recovery/ClearCostmapRecovery}
  - {name: aggressive_reset_19, type: clear_costmap_recovery/ClearCostmapRecovery}
  - {name: aggressive_reset_20, type: clear_costmap_recovery/ClearCostmapRecovery}
  - {name: aggressive_reset_21, type: clear_costmap_recovery/ClearCostmapRecovery}
conservative_reset:
  reset_distance: 3.0           # clear outside a 3 m square around the robot
  layer_names: [obstacle_layer]
aggressive_reset_1: &aggressive_reset
  reset_distance: 1.0           # 4 x robot_radius, move_base's default for this step
  layer_names: [obstacle_layer]
aggressive_reset_2: *aggressive_reset
aggressive_reset_3: *aggressive_reset
aggressive_reset_4: *aggressive_reset
aggressive_reset_5: *aggressive_reset
aggressive_reset_6: *aggressive_reset
aggressive_reset_7: *aggressive_reset
aggressive_reset_8: *aggressive_reset
aggressive_reset_9: *aggressive_reset
aggressive_reset_10: *aggressive_reset
aggressive_reset_11: *aggressive_reset
aggressive_reset_12: *aggressive_reset
aggressive_reset_13: *aggressive_reset
aggressive_reset_14: *aggressive_reset
aggressive_reset_15: *aggressive_reset
aggressive_reset_16: *aggressive_reset
aggressive_reset_17: *aggressive_reset
aggressive_reset_18: *aggressive_reset
aggressive_reset_19: *aggressive_reset
aggressive_reset_20: *aggressive_reset
aggressive_reset_21: *aggressive_reset

NavfnROS:
  allow_unknown: true
  # Plan to the goal itself or not at all. With a tolerance, a goal too close to an obstacle (or
  # one an obstacle later covers) was silently replaced by the nearest free point up to 0.5 m
  # away, and move_base then reported that point as reached.
  default_tolerance: 0.0
  use_dijkstra: true            # Dijkstra rather than A*
  visualize_potential: false

# Conservative forward limit for Unity; its controller clamps turns to 0.5 rad/s.
DWAPlannerROS:
  max_vel_trans: 0.2
  # DWA accepts a candidate if either minimum is met. Zero here also admits
  # tiny in-place turns below min_vel_theta, which can stall Unity's wheels.
  min_vel_trans: 0.03
  max_vel_x: 0.2
  min_vel_x: -0.1                # back away slowly (both candidates); cmd_vel_guard checks it
  max_vel_y: 0.0
  min_vel_y: 0.0
  max_vel_theta: 0.5
  min_vel_theta: 0.2
  # DWA samples only velocities reachable within one 0.1 s cycle at these limits. 2.5 m/s^2 lets
  # every cycle pick any speed up to max_vel_x; Unity's wheel drives ramp physically. At 0.5, a
  # robot that had slowed near an obstacle could sample at most 0.05 m/s: trajectories 0.1 m
  # long, so it crawled or turned on the spot instead of driving round.
  acc_lim_x: 2.5
  acc_lim_y: 0.0
  acc_lim_trans: 2.5
  # At 10 Hz, sample up to 0.25 rad/s from rest so a 0.2 rad/s turn is reachable. An in-place
  # turn cannot reverse within one cycle (|w| >= min_vel_theta), so a global path that switches
  # sides makes the robot turn the long way round; the global costmap's 6 m range prevents that.
  # 4.0 or more allows the reversal but makes DWA dither in front of narrow gaps.
  acc_lim_theta: 2.5
  trans_stopped_vel: 0.02
  theta_stopped_vel: 0.02
  holonomic_robot: false

  xy_goal_tolerance: 0.25
  yaw_goal_tolerance: 0.25
  latch_xy_goal_tolerance: true # once in position, only rotate to the goal heading

  sim_time: 2.0
  sim_granularity: 0.05
  angular_sim_granularity: 0.025
  vx_samples: 15
  vy_samples: 1
  vth_samples: 20

  path_distance_bias: 32.0      # DWB PathDist / PathAlign scale
  goal_distance_bias: 24.0      # DWB GoalDist / GoalAlign scale
  # Keep away from obstacles. At 0.02 DWA hugged the path within 0.25 m of thin objects (posts
  # the scan only marks from close up); once the footprint touches one, no trajectory is valid
  # and the goal fails. 0.1 keeps ~0.45 m in the Unity warehouse. With the local inflation
  # below, this cost only applies within 0.30 m of body clearance, closer than Navfn's path.
  occdist_scale: 0.1
  forward_point_distance: 0.1
  stop_time_buffer: 0.2
  oscillation_reset_dist: 0.05
  prune_plan: true
  publish_traj_pc: false
  publish_cost_grid_pc: false

# rotate_recovery (not in recovery_behaviors above) reads this legacy namespace even when DWA is
# the local planner. If you add it back, keep its turn rate within the Unity controller's limit.
TrajectoryPlannerROS:
  max_vel_theta: 0.5
  min_in_place_vel_theta: 0.2
  acc_lim_theta: 2.5
  yaw_goal_tolerance: 0.25

# Shared by both costmaps' obstacle layers.
obstacle_layer_scan: &scan_source
  topic: /scan
  data_type: LaserScan
  marking: true
  clearing: true
  inf_is_valid: true
  observation_persistence: 0.0
  expected_update_rate: 0.5
  min_obstacle_height: 0.0
  max_obstacle_height: 2.0
  obstacle_range: 3.0
  raytrace_range: 4.0

global_costmap:
  global_frame: map
  robot_base_frame: base_link
  update_frequency: 2.0
  publish_frequency: 2.0
  transform_tolerance: 0.3
  resolution: 0.05
  robot_radius: 0.25
  track_unknown_space: true
  always_send_full_costmap: true
  plugins:
    - {name: static_layer, type: "costmap_2d::StaticLayer"}
    - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}
  static_layer:
    map_topic: /map
    subscribe_to_updates: true
  obstacle_layer:
    footprint_clearing_enabled: true
    observation_sources: scan
    # Mark further out than the local costmap, so Navfn sees the whole of a shelf row before it
    # picks a side. At 3 m the far end of a long rack was unmarked: the path went round it,
    # then switched sides as the robot came closer, and DWA turned the robot around.
    scan:
      <<: *scan_source
      obstacle_range: 6.0
      raytrace_range: 7.0
  inflation_layer:
    cost_scaling_factor: 3.0
    inflation_radius: 0.60        # Navfn's path keeps ~0.35 m of body clearance (see below)

local_costmap:
  global_frame: odom
  robot_base_frame: base_link
  update_frequency: 10.0
  publish_frequency: 5.0
  transform_tolerance: 0.3
  rolling_window: true
  width: 6
  height: 6
  resolution: 0.05
  robot_radius: 0.25
  always_send_full_costmap: true
  plugins:
    - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}
  obstacle_layer:
    footprint_clearing_enabled: true
    observation_sources: scan
    scan: *scan_source
  # DWA reads the cost under the footprint's outline, not its centre, so this inflation counts
  # from the robot's edge: cost falls to zero at 0.30 m of body clearance. Navfn's path (global
  # inflation 0.60 m from the centre) keeps about 0.35 m, so following it costs nothing. At
  # 0.55 m here, the path itself lay in high cost; DWA preferred short, slow trajectories
  # near shelves and corners and ended up turning on the spot.
  inflation_layer:
    cost_scaling_factor: 3.0
    inflation_radius: 0.30
