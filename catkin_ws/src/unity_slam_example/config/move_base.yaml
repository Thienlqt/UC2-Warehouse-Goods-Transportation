# ROS 1 Noetic move_base / TurtleBot3 Waffle in the Unity simulation. Loaded into the move_base
# node's namespace; /use_sim_time is set by the launch file.
# Global planner NavfnROS, local planner DWAPlannerROS. Tune robot_radius (0.22 m estimate)
# against the actual robot before changing platforms; test/check_obstacle_costmap.py uses it.
# 0.5 s expected_update_rate is a maximum scan interval in simulation time, not Hz.
# The collision-monitor stop lives in cmd_vel_guard (launch file), not here.
# With perception, move_base_predicted.yaml adds tracked obstacles' predicted paths to the local
# costmap.

base_global_planner: navfn/NavfnROS
base_local_planner: dwa_local_planner/DWAPlannerROS
controller_frequency: 10.0
planner_frequency: 1.0          # replan the global path at 1 Hz
planner_patience: 5.0
controller_patience: 15.0
oscillation_timeout: 20.0       # recover if the robot moves < 0.1 m in 20 s
oscillation_distance: 0.1
max_planning_retries: -1
recovery_behavior_enabled: true
clearing_rotation_allowed: true
shutdown_costmaps: false
# Recover by clearing the scan obstacles and replanning. The default list adds two full in-place
# spins (rotate_recovery), which see nothing new with a 360 degree lidar and only stall the robot.
# layer_names must match the costmap plugin names: the default ("obstacles") clears nothing here.
recovery_behaviors:
  - {name: conservative_reset, type: clear_costmap_recovery/ClearCostmapRecovery}
  - {name: aggressive_reset, type: clear_costmap_recovery/ClearCostmapRecovery}
conservative_reset:
  reset_distance: 3.0           # clear outside a 3 m square around the robot
  layer_names: [obstacle_layer]
aggressive_reset:
  reset_distance: 0.92          # 4 x robot_radius, move_base's default for this step
  layer_names: [obstacle_layer]

NavfnROS:
  allow_unknown: true
  default_tolerance: 0.5
  use_dijkstra: true            # Dijkstra rather than A*
  visualize_potential: false

# Conservative forward limit for Unity; its controller clamps turns to 0.5 rad/s.
DWAPlannerROS:
  max_vel_trans: 0.2
  # DWA accepts a candidate if either minimum is met. Zero here also admits
  # tiny in-place turns below min_vel_theta, which can stall Unity's wheels.
  min_vel_trans: 0.03
  max_vel_x: 0.2
  min_vel_x: 0.0
  max_vel_y: 0.0
  min_vel_y: 0.0
  max_vel_theta: 0.5
  min_vel_theta: 0.2
  acc_lim_x: 0.5
  acc_lim_y: 0.0
  acc_lim_trans: 0.5
  # At 10 Hz, sample up to 0.25 rad/s from rest so a 0.2 rad/s turn is reachable.
  acc_lim_theta: 2.5
  trans_stopped_vel: 0.02
  theta_stopped_vel: 0.02
  holonomic_robot: false

  xy_goal_tolerance: 0.25
  yaw_goal_tolerance: 0.25
  latch_xy_goal_tolerance: true # once in position, only rotate to the goal heading

  sim_time: 2.0
  sim_granularity: 0.05
  angular_sim_granularity: 0.025
  vx_samples: 15
  vy_samples: 1
  vth_samples: 20

  path_distance_bias: 32.0      # DWB PathDist / PathAlign scale
  goal_distance_bias: 24.0      # DWB GoalDist / GoalAlign scale
  # Keep away from obstacles. At 0.02 DWA hugged the path within 0.25 m of thin objects (posts
  # the scan only marks from close up); once the footprint touches one, no trajectory is valid
  # and the goal fails. 0.1 keeps ~0.45 m in the Unity warehouse.
  occdist_scale: 0.1
  forward_point_distance: 0.1
  stop_time_buffer: 0.2
  oscillation_reset_dist: 0.05
  prune_plan: true
  publish_traj_pc: false
  publish_cost_grid_pc: false

# rotate_recovery (not in recovery_behaviors above) reads this legacy namespace even when DWA is
# the local planner. If you add it back, keep its turn rate within the Unity controller's limit.
TrajectoryPlannerROS:
  max_vel_theta: 0.5
  min_in_place_vel_theta: 0.2
  acc_lim_theta: 2.5
  yaw_goal_tolerance: 0.25

# Shared by both costmaps' obstacle layers.
obstacle_layer_scan: &scan_source
  topic: /scan
  data_type: LaserScan
  marking: true
  clearing: true
  inf_is_valid: true
  observation_persistence: 0.0
  expected_update_rate: 0.5
  min_obstacle_height: 0.0
  max_obstacle_height: 2.0
  obstacle_range: 3.0
  raytrace_range: 4.0

global_costmap:
  global_frame: map
  robot_base_frame: base_link
  update_frequency: 2.0
  publish_frequency: 2.0
  transform_tolerance: 0.3
  resolution: 0.05
  robot_radius: 0.22
  track_unknown_space: true
  always_send_full_costmap: true
  plugins:
    - {name: static_layer, type: "costmap_2d::StaticLayer"}
    - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}
  static_layer:
    map_topic: /map
    subscribe_to_updates: true
  obstacle_layer:
    footprint_clearing_enabled: true
    observation_sources: scan
    scan: *scan_source
  inflation_layer:
    cost_scaling_factor: 3.0
    inflation_radius: 0.55

local_costmap:
  global_frame: odom
  robot_base_frame: base_link
  update_frequency: 10.0
  publish_frequency: 5.0
  transform_tolerance: 0.3
  rolling_window: true
  width: 6
  height: 6
  resolution: 0.05
  robot_radius: 0.22
  always_send_full_costmap: true
  plugins:
    - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}
  obstacle_layer:
    footprint_clearing_enabled: true
    observation_sources: scan
    scan: *scan_source
  inflation_layer:
    cost_scaling_factor: 3.0
    inflation_radius: 0.55
