odom_frame_id: odom
base_frame_id: base_footprint
global_frame_id: map
transform_tolerance: 2.0
gui_publish_rate: 10.0

# Particle filter settings
min_particles: 500
max_particles: 2000
kld_err: 0.05
update_min_d: 0.2
update_min_a: 0.5
resample_interval: 1

# Laser model settings
laser_max_beams: 60
laser_z_hit: 0.95
laser_z_short: 0.1
laser_z_max: 0.05
laser_z_rand: 0.05
laser_sigma_hit: 0.2
laser_lambda_short: 0.1
laser_model_type: likelihood_field
laser_likelihood_max_dist: 2.0

# Odometry model settings
odom_model_type: diff-corrected
odom_alpha1: 0.005
odom_alpha2: 0.005
odom_alpha3: 0.010
odom_alpha4: 0.005