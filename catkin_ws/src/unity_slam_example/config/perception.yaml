# Obstacle detection (camera + 2D lidar). See docs/obstacle_detection.md.
# Loaded at the root namespace: each block becomes the private parameters of that node.
lidar_obstacles:
  fixed_frame: odom           # tracks live here so robot motion is not mistaken for object motion
  max_extent: 3.0             # drop segments longer than this (walls)
  box_height: 0.5             # a 2D scan has no height; used for display and projection only
  breakpoint_angle_deg: 10.0  # adaptive breakpoint: smaller splits objects more eagerly
  sigma: 0.03                 # range noise (m)
  min_points: 3
  track_gate: 0.6             # max centre jump (m) between scans for the same track
  max_misses: 3               # scans without a match before a track is dropped
  # Motion check: a track's velocity is published only when the scan sees free space where the
  # track's points were 0.4-1.0 s earlier. A static box's centre drifts as faces come into view,
  # which fooled the Kalman velocity alone into sweeping static boxes across the path.
  motion_min_age: 0.4         # compare with points at least this old (s)
  motion_max_age: 1.0         # and at most this old (s)
  motion_margin: 0.15         # a beam must pass this far beyond an old point to count it free (m)
  motion_min_evidence: 3      # points needed for a moving or static verdict
  motion_moved_fraction: 0.25 # share of the evidence points that must be free to call it moving
  # /scan_static (slam_toolbox's input) drops returns within this distance of a moving track's box,
  # so moving obstacles leave no trail in the map.
  static_scan_margin: 0.1     # (m)

camera_detector:
  # Defaults: models/detector.onnx and models/classes.txt installed with this package.
  conf_threshold: 0.35
  iou_threshold: 0.5
  threads: 4
  publish_annotated_image: true

obstacle_fusion:
  iou_gate: 0.3               # min horizontal IoU between a projected lidar box and a camera box
  label_ttl: 1.0              # keep a camera label on a track this long without re-detection (s)
  robot_frame: base_link

# Avoidance from the tracks above: /obstacles -> /obstacles_predicted (grid for the local costmap).
# See docs/obstacle_avoidance.md. min_speed and min_confidence are also cmd_vel_guard parameters
# in the launch file; keep them equal.
predicted_obstacles:
  horizon: 2.0                # seconds of constant-velocity prediction (DWA sim_time)
  step: 0.2                   # prediction step (s); outlines overlap at walking speeds
  min_speed: 0.15             # m/s; slower tracks count as static (Kalman velocity noise)
  min_confidence: 0.3         # fused scores can be lower than lidar-only ones
  spacing: 0.025              # outline point spacing (m): half a costmap cell, so points on cell
                              # boundaries cannot skip a cell along an edge
  keep_out: 0.45              # drop predicted points this close to the robot centre (m)
  # Lethal only where a track will be within lethal_horizon (s); further along its path the cost
  # falls from graded_max to graded_min (of 100): DWA may cross there but prefers not to.
  # 80 maps to costmap cost 203, below inscribed (253), so those cells never block a trajectory.
  lethal_horizon: 0.8
  graded_max: 80
  graded_min: 30
  grid_size: 6.0              # grid side (m) around the robot: the local costmap's size
  resolution: 0.05            # the local costmap's resolution
  obstacle_timeout: 0.5       # publish an empty grid when /obstacles is older than this (s)
  padding:                    # extra clearance per class (m), 0 for unlisted classes; a padded
    person: 0.35              # class is marked even when it stands still
