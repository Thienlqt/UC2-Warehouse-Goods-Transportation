# Candidate B (docs/obstacle_avoidance.md): TEB instead of DWA. Loaded after move_base.yaml with
# planner:=teb, so move_base's patience and recoveries are shared with DWA. Limits match DWA's.
# Moving tracks arrive with their velocities on ~obstacles (teb_obstacles); TEB predicts them in
# time itself, so the launch file leaves out the predicted_layer (move_base_predicted.yaml).
base_local_planner: teb_local_planner/TebLocalPlannerROS

TebLocalPlannerROS:
  odom_topic: odom
  map_frame: odom

  max_vel_x: 0.2
  max_vel_x_backwards: 0.1
  max_vel_theta: 0.5
  acc_lim_x: 2.5
  acc_lim_theta: 2.5
  footprint_model:
    type: circular
    radius: 0.25                  # robot_radius in move_base.yaml

  xy_goal_tolerance: 0.25
  yaw_goal_tolerance: 0.25

  min_obstacle_dist: 0.15         # from the robot's circle
  inflation_dist: 0.35
  include_costmap_obstacles: true
  costmap_converter_plugin: ""    # costmap cells as point obstacles
  include_dynamic_obstacles: true
  dynamic_obstacle_inflation_dist: 0.4

  weight_kinematics_forward_drive: 100   # reverse only when it clearly pays
  enable_homotopy_class_planning: true   # keep alternative ways round obstacles
  max_number_classes: 3
